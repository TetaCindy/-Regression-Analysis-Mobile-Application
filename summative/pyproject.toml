[project]
name = "hospital-visit-time"
version = "0.1.0"
description = "Predict how long an emergency department visit will take (regression, FastAPI, Flutter)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "scikit-learn",
    "pandas",
    "numpy",
    "joblib",
    "python-multipart",
]

[dependency-groups]
dev = [
    "matplotlib",
    "seaborn",
    "jupyter",
    "nbconvert",
    "ipykernel",
    "httpx",
]
