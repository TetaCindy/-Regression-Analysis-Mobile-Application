[project]
name = "garment-productivity-regression"
version = "0.1.0"
description = "Garment worker productivity prediction: regression models, FastAPI service and Flutter app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.5",
    "joblib>=1.6.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.7.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "nbconvert>=7.17.2",
    "seaborn>=0.13.2",
]
